name: sqlsnap
description: Mobile SQL client for MySQL, PostgreSQL and ClickHouse with query templates.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  path_provider: ^2.1.0
  flutter_secure_storage: ^9.2.2
  postgres: ^3.4.0
  mysql_client: ^0.0.27
  quick_actions: ^1.1.1
  share_plus: ^12.0.2
  local_auth: ^3.0.2
  package_info_plus: ^9.0.1
  excel: ^4.0.6
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
