name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org tech.mpspace --project-name sqlsnap .
            rm -rf test
            MANIFEST=android/app/src/main/AndroidManifest.xml
            # network permissions + allow plain HTTP (ClickHouse :8123), app name
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application android:usesCleartextTraffic="true"#' "$MANIFEST"
            sed -i 's#android:label="sqlsnap"#android:label="SQL Snap"#' "$MANIFEST"
            # launcher icons
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp "branding/ic_launcher_$d.png" "android/app/src/main/res/mipmap-$d/ic_launcher.png"
            done
            cat "$MANIFEST"
          fi

      - name: Use persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Signing with persistent key from secrets"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 is not set: APK is signed with a random key, updates will require reinstall (data loss)."
          fi

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cp build/app/outputs/flutter-apk/app-release.apk "sqlsnap-$VER.apk"
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sqlsnap-apk
          path: sqlsnap-*.apk

      - name: Publish "latest" release
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SQL Snap (latest build)
          prerelease: true
          make_latest: false
          files: sqlsnap-*.apk
          body: Автосборка из ${{ github.sha }}

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: sqlsnap-*.apk
